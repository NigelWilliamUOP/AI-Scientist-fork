# Prepare the benchmark and install the overlay before running. The installer
# copies only public/starter data into ./data/sro_reconstruction_pilot.
# Private labels remain outside the ScienceFlow checkout and must be supplied:
#   export SRO_PRIVATE_LABELS=/absolute/path/to/sro_scienceflow_pilot/.private/holdout_labels.csv
#   uv run python -m scienceflow.cli parallel \
#     -m scienceflow/config/examples/tasks_sro_reconstruction_pilot.yaml -j 1

max_concurrent: 1
time_limit: 3600
resume: false

lnr:
  max_steps: 250
  resource_control_mode: resource_smart_policy

defaults:
  config: scienceflow/config/default.yaml
  phase: run
  type: lnr
  workspace_base: ./workspaces/sro_reconstruction_pilot
  evaluator:
    enabled: true
    backend: task_package
  gate:
    params:
      minimum_metric_validity: high

tasks:
  - exp_id: sro-reconstruction-pilot
    run_id: sro-reconstruction-pilot-v1
    input_data_dir: ./data/sro_reconstruction_pilot
    time_limit: 3600
    cpu_list: "0-7"
    gpu_list: cpu
    lnr:
      wall_clock_budget_sec: 2700
      num_workers: 2
      omp_threads_cap: 4
      resource_gpu_pool: []
      seed: 20260818
