name: challenge-harness-validation
on:
  push:
    branches:
      - agent/social-science-challenge-harness-v0-1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile challenge modules
        run: python -m compileall -q research_campaigns/challenge_harness.py research_campaigns/challenge_demo.py research_campaigns/challenge_cli.py research_campaigns/tests/test_challenge_harness.py
      - name: Run challenge harness tests
        run: python -m unittest research_campaigns.tests.test_challenge_harness -v
      - name: Run offline mutation demo
        run: python -m research_campaigns.challenge_cli demo --output ./research_campaigns_runs/challenge-demo
