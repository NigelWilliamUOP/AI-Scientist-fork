name: SRO ScienceFlow pilot

on:
  pull_request:
    paths:
      - "experimental/sro_scienceflow_pilot/**"
      - ".github/workflows/sro-scienceflow-pilot.yml"
  push:
    paths:
      - "experimental/sro_scienceflow_pilot/**"
      - ".github/workflows/sro-scienceflow-pilot.yml"

permissions:
  contents: read

jobs:
  evaluator-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experimental/sro_scienceflow_pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py scienceflow_overlay/tasks/opt_solver/sro-reconstruction-pilot/evaluator.py
      - run: python -m pytest -q
